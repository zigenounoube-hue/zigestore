<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#7f77dd"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="zigeStore"/>
  <title>zigeStore</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0b0b12; --surface:#111119; --card:#14141f;
      --border:#22223a; --border-hi:#3a3060;
      --purple:#8b7ff5; --purple-lo:#6c61d4; --purple-hi:#c4baff;
      --glow:#8b7ff540;
      --text:#e8e2ff; --muted:#5a556e; --dim:#2e2a40;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bot:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overscroll-behavior:none}
    #app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}

    #topbar{padding:calc(var(--safe-top) + 14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
    .logo{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;filter:drop-shadow(0 0 14px var(--glow))}
    .logo em{color:var(--purple-hi);font-style:normal}
    .logo span{color:var(--purple-lo)}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--dim);border:1px solid var(--purple-lo);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--purple-hi);letter-spacing:.5px}

    #install-banner{display:none;margin:10px 16px 0;padding:12px 16px;background:linear-gradient(135deg,#1a1330,#12102a);border:0.5px solid var(--purple-lo);border-radius:14px;align-items:center;gap:12px}
    #install-banner p{flex:1;font-size:13px;color:var(--purple-hi);font-weight:500}
    #install-banner p span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
    #install-btn{background:var(--purple);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}

    #search-wrap{padding:14px 16px 6px}
    .search-container{position:relative}
    .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
    #search{width:100%;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:11px 16px 11px 40px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
    #search::placeholder{color:var(--muted)}
    #search:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--glow)}

    #cats{display:flex;gap:8px;padding:8px 16px 10px;overflow-x:auto;scrollbar-width:none}
    #cats::-webkit-scrollbar{display:none}
    .cat-btn{padding:6px 16px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;border:0.5px solid var(--border);background:transparent;color:var(--muted);transition:all .18s;font-family:'Inter',sans-serif}
    .cat-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 0 18px var(--glow)}

    #content{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:4px 16px calc(var(--safe-bot) + 84px)}
    #content::-webkit-scrollbar{display:none}
    .section-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 10px}

    .app-card{background:var(--card);border:0.5px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;transition:border-color .2s,transform .15s;position:relative;overflow:hidden;animation:fadeUp .3s ease both}
    .app-card::before{content:'';position:absolute;inset:0;opacity:0;background:linear-gradient(135deg,var(--glow) 0%,transparent 60%);transition:opacity .2s;border-radius:18px;pointer-events:none}
    .app-card:active{transform:scale(.98)}
    .app-card:active::before{opacity:1}
    .app-card.featured{border-color:var(--purple-lo);background:linear-gradient(135deg,#16142a 0%,var(--card) 60%)}

    .app-icon{width:52px;height:52px;border-radius:14px;background:var(--dim);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:0.5px solid var(--border-hi)}
    .app-info{flex:1;min-width:0}
    .app-name-row{display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap}
    .app-name{font-size:15px;font-weight:600;color:var(--text)}
    .badge-new{font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:999px;background:var(--dim);border:0.5px solid var(--purple);color:var(--purple-hi);flex-shrink:0}
    .badge-cat{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:500;flex-shrink:0}
    .cat-Medias{background:#1a0f2a;color:#c084fc;border:0.5px solid #6d28d9}
    .cat-Utilitaires{background:#0f1e2a;color:#67e8f9;border:0.5px solid #0e7490}
    .cat-Systeme{background:#0f2a1a;color:#4ade80;border:0.5px solid #166534}
    .cat-Confidentialite{background:#2a1510;color:#fb923c;border:0.5px solid #9a3412}
    .app-desc{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .app-meta{font-size:10px;color:var(--dim)}

    .dl-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--dim);border:0.5px solid var(--purple-lo);border-radius:12px;padding:10px 12px;cursor:pointer;text-decoration:none;transition:background .18s,box-shadow .18s;flex-shrink:0}
    .dl-btn:active{background:var(--purple-lo);box-shadow:0 0 16px var(--glow)}
    .dl-icon{font-size:18px}
    .dl-label{font-size:10px;font-weight:600;color:var(--purple-hi);letter-spacing:.03em}

    #empty{display:none;text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
    #empty .emoji{font-size:40px;margin-bottom:12px;display:block}
    #loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 20px}
    .spinner{width:36px;height:36px;border:2.5px solid var(--dim);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #loader p{color:var(--muted);font-size:13px}

    #navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(11,11,18,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid var(--border);padding:10px 0 calc(var(--safe-bot) + 10px);display:flex;justify-content:space-around;z-index:20}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0 20px}
    .nav-icon{font-size:20px;opacity:.3;transition:opacity .15s}
    .nav-lbl{font-size:10px;font-weight:500;color:var(--muted);transition:color .15s}
    .nav-dot{width:4px;height:4px;border-radius:50%;background:var(--purple);opacity:0;transition:opacity .15s}
    .nav-item.active .nav-icon{opacity:1;filter:drop-shadow(0 0 6px var(--purple))}
    .nav-item.active .nav-lbl{color:var(--purple-hi)}
    .nav-item.active .nav-dot{opacity:1}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo"><em>zige</em><span>Store</span></div>
    <div class="avatar">ZG</div>
  </div>

  <div id="install-banner">
    <p>Installer l'app <span>Accès rapide depuis l'écran d'accueil</span></p>
    <button id="install-btn">Installer</button>
  </div>

  <div id="search-wrap">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input id="search" type="search" placeholder="Rechercher une app…" autocomplete="off"/>
    </div>
  </div>

  <div id="cats">
    <button class="cat-btn active" data-cat="Toutes">Toutes</button>
    <button class="cat-btn" data-cat="Médias">Médias</button>
    <button class="cat-btn" data-cat="Utilitaires">Utilitaires</button>
    <button class="cat-btn" data-cat="Système">Système</button>
    <button class="cat-btn" data-cat="Confidentialité">Confidentialité</button>
  </div>

  <div id="content">
    <div id="loader"><div class="spinner"></div><p>Chargement…</p></div>
    <div id="empty"><span class="emoji">🔭</span>Aucune app trouvée.</div>
    <div id="app-list"></div>
  </div>

  <nav id="navbar">
    <div class="nav-item active" data-nav="store">
      <span class="nav-icon">⊞</span><span class="nav-lbl">Store</span><span class="nav-dot"></span>
    </div>
    <div class="nav-item" data-nav="recents">
      <span class="nav-icon">↓</span><span class="nav-lbl">Récents</span><span class="nav-dot"></span>
    </div>
    <div class="nav-item" data-nav="settings">
      <span class="nav-icon">⚙</span><span class="nav-lbl">Paramètres</span><span class="nav-dot"></span>
    </div>
  </nav>
</div>

<script>
let allApps=[], currentCat='Toutes', searchVal='';

function catClass(cat){
  return 'cat-'+cat.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s/g,'');
}

async function loadApps(){
  try{
    const r=await fetch('apps.json?t='+Date.now());
    allApps=await r.json();
    document.getElementById('loader').style.display='none';
    render();
  }catch(e){
    document.getElementById('loader').innerHTML='<p style="color:#ff5e6d">Impossible de charger les apps.<br>Vérifie ta connexion.</p>';
  }
}

function render(){
  const list=document.getElementById('app-list');
  const empty=document.getElementById('empty');
  let apps=allApps.filter(a=>{
    const catOk=currentCat==='Toutes'||a.category===currentCat;
    const srchOk=!searchVal||a.name.toLowerCase().includes(searchVal);
    return catOk&&srchOk;
  });
  if(!apps.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const featured=apps.filter(a=>a.featured);
  const rest=apps.filter(a=>!a.featured);
  let html='';
  if(featured.length){
    html+='<div class="section-label">⚡ En vedette</div>';
    featured.forEach(a=>{html+=card(a);});
  }
  if(rest.length){
    html+='<div class="section-label">Toutes les apps</div>';
    rest.forEach(a=>{html+=card(a);});
  }
  list.innerHTML=html;
  list.querySelectorAll('.app-card').forEach((el,i)=>{el.style.animationDelay=(i*55)+'ms';});
}

function card(a){
  return `<div class="app-card ${a.featured?'featured':''}">
    <div class="app-icon">${a.iconEmoji}</div>
    <div class="app-info">
      <div class="app-name-row">
        <span class="app-name">${a.name}</span>
        ${a.featured?'<span class="badge-new">★ VEDETTE</span>':''}
        <span class="badge-cat ${catClass(a.category)}">${a.category}</span>
      </div>
      <div class="app-desc">${a.description}</div>
      <div class="app-meta">${a.version} · ${a.sizeMb} MB</div>
    </div>
    <a class="dl-btn" href="${a.apkUrl}" download>
      <span class="dl-icon">⬇</span><span class="dl-label">APK</span>
    </a>
  </div>`;
}

document.getElementById('cats').addEventListener('click',e=>{
  const btn=e.target.closest('.cat-btn');
  if(!btn)return;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentCat=btn.dataset.cat;
  render();
});

document.getElementById('search').addEventListener('input',e=>{
  searchVal=e.target.value.toLowerCase().trim();
  render();
});

document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
  });
});

let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-banner').style.display='flex';
});
document.getElementById('install-btn').addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  if(outcome==='accepted')document.getElementById('install-banner').style.display='none';
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
loadApps();
</script>
</body>
</html>
